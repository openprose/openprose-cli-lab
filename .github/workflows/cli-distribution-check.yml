name: CLI distribution rehearsal
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cli-distribution-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package-and-install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-22.04-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Require the approved distribution license
        run: |
          if [ ! -f LICENSE ]; then
            echo '::error::Root LICENSE is missing. Restore the approved license before packaging.'
            exit 1
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.20.0'
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          version: '0.12.15'
          enable-cache: false
      - name: Prepare pinned Python on every architecture
        run: |
          uv python install 3.10.20
          uv venv --python 3.10.20 --seed "$RUNNER_TEMP/distribution-python"
          echo "$RUNNER_TEMP/distribution-python/bin" >> "$GITHUB_PATH"
      - uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3
        with:
          bun-version: '1.3.5'
          # Match the standalone target so isolated x64 builds do not fetch a
          # second Bun runtime after the rehearsal disables network access.
          bun-download-url: ${{ matrix.os == 'ubuntu-22.04' && 'https://github.com/oven-sh/bun/releases/download/bun-v1.3.5/bun-linux-x64-baseline.zip' || matrix.os == 'macos-15-intel' && 'https://github.com/oven-sh/bun/releases/download/bun-v1.3.5/bun-darwin-x64-baseline.zip' || '' }}
      - name: Prepare locked toolchains and dependencies
        run: |
          rustup toolchain install 1.87.0 --profile minimal
          rustup default 1.87.0
          cargo fetch --locked --manifest-path cli/rust/Cargo.toml
          python3 -m pip install --require-hashes --only-binary=:all: -r cli/ci/requirements-test.txt
          cd cli/bun
          bun install --frozen-lockfile --ignore-scripts
      - name: Test distribution plan adapter
        run: |
          python3 -m unittest discover -s cli/ci -p test_distribution_plan.py
          python3 -m unittest discover -s cli/ci -p test_npm_identity.py
          python3 -m unittest discover -s cli/ci -p test_rehearse_npm_identity.py
      - name: Build, package and exercise fresh standalone and npm installations
        run: python3 cli/ci/rehearse_release.py --output "$RUNNER_TEMP/cli-rehearsal" --trials 1
      - name: Rehearse the preferred npm identity offline
        run: python3 cli/ci/rehearse_npm_identity.py "$RUNNER_TEMP/cli-rehearsal/package" --out "$RUNNER_TEMP/cli-rehearsal/preferred-npm-identity"
      - name: Retain rehearsal evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cli-rehearsal-${{ matrix.os }}
          path: ${{ runner.temp }}/cli-rehearsal
          retention-days: 14
          if-no-files-found: warn
