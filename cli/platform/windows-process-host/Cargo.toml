[package]
name = "openprose-windows-process-host"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
license = "MIT"
publish = false

[[bin]]
name = "openprose-windows-process-host"
path = "src/main.rs"

[[bin]]
name = "openprose-windows-process-fixture"
path = "src/bin/openprose_windows_process_fixture.rs"
required-features = ["fixture"]

[features]
default = []
fixture = []

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_JobObjects",
  "Win32_System_Pipes",
  "Win32_System_Threading",
] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
