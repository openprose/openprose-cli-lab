[workspace]
members = ["acp-transport-lab", "rig-embedded-lab"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
publish = false
rust-version = "1.90"

[workspace.dependencies]
agent-client-protocol = "=2.0.0"
futures = "=0.3.32"
rig = { version = "=0.42.0", default-features = false, features = ["agent"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.47.1", features = ["macros", "rt-multi-thread", "sync", "time"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
