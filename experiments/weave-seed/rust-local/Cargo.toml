[package]
name = "weave-rust-local"
version = "0.0.0"
edition = "2021"
publish = false
default-run = "weave-rust-local"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
libc = "0.2"
weave-file-binding-experiment = { path = "../rust-binding", version = "0.0.0" }
weave-local-host-experiment = { path = "../rust-host", version = "0.0.0" }

[[bin]]
name = "weave-local-test-fixture"
path = "tests/support/fixture.rs"
test = false
